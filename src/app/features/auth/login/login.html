<div class="min-h-screen w-full flex flex-col justify-between bg-linear-to-b from-[#faf9fc] via-purple-50/20 to-white dark:from-gray-950 dark:via-gray-900 dark:to-gray-950 text-gray-900 dark:text-gray-100 transition-colors">
  <!-- Top Navigation Bar for Auth View -->
  <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
    <a
      [routerLink]="['/dashboard']"
      class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold text-gray-600 dark:text-gray-400 hover:text-purple-600 dark:hover:text-purple-400 transition-colors"
    >
      <ng-icon name="lucideArrowLeft" class="size-4" />
      <span>Back to Store</span>
    </a>

    <!-- Theme Toggle Button -->
    <button
      type="button"
      (click)="store.toggleTheme()"
      class="flex size-9 items-center justify-center rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors cursor-pointer shadow-2xs"
      [title]="store.theme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
    >
      <ng-icon [name]="store.theme() === 'dark' ? 'lucideSun' : 'lucideMoon'" class="size-4 text-purple-600 dark:text-amber-300" />
    </button>
  </header>

  <!-- Centered Login Card -->
  <main class="w-full flex-1 flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-md space-y-6">
      <!-- Header Brand -->
      <div class="text-center space-y-2">
        <a [routerLink]="['/dashboard']" class="inline-flex size-14 items-center justify-center rounded-2xl bg-purple-600 text-white shadow-lg shadow-purple-600/30 hover:scale-105 transition-transform">
          <ng-icon name="lucideShoppingBag" class="size-8" />
        </a>
        <h1 class="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white tracking-tight">
          Welcome Back to <span class="text-purple-600 dark:text-purple-400">ShopEase</span>
        </h1>
        <p class="text-xs sm:text-sm text-gray-500 dark:text-gray-400">
          Log in to track orders, access your wishlist & exclusive deals
        </p>
      </div>

      <!-- Main Card -->
      <div class="rounded-3xl border border-gray-200/80 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 sm:p-8 shadow-xl shadow-purple-900/5 space-y-5 transition-colors">
        <!-- Error Banner -->
        @if (errorMessage()) {
          <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-400 text-xs font-semibold animate-in fade-in">
            {{ errorMessage() }}
          </div>
        }

        <!-- Form -->
        <form (submit)="onSubmit(); $event.preventDefault()" class="space-y-4">
          <!-- Email Input -->
          <div>
            <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider mb-1.5">Email Address</label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-gray-400 dark:text-gray-500">
                <ng-icon name="lucideMail" class="size-4" />
              </span>
              <input
                type="email"
                [(ngModel)]="email"
                name="email"
                required
                placeholder="you@example.com"
                class="h-11 w-full rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 pl-10 pr-3.5 text-sm text-gray-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-600 focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-500/20 transition-all"
              />
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider">Password</label>
              <button
                type="button"
                (click)="store.showToast('Password reset link sent to registered email address.', 'info')"
                class="text-xs font-semibold text-purple-600 dark:text-purple-400 hover:underline cursor-pointer"
              >
                Forgot Password?
              </button>
            </div>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-gray-400 dark:text-gray-500">
                <ng-icon name="lucideLock" class="size-4" />
              </span>
              <input
                [type]="showPassword() ? 'text' : 'password'"
                [(ngModel)]="password"
                name="password"
                required
                placeholder="••••••••"
                class="h-11 w-full rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 pl-10 pr-10 text-sm text-gray-900 dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-600 focus:outline-none focus:border-purple-600 focus:ring-2 focus:ring-purple-500/20 transition-all"
              />
              <button
                type="button"
                (click)="togglePassword()"
                class="absolute right-3.5 text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 cursor-pointer"
                [title]="showPassword() ? 'Hide password' : 'Show password'"
              >
                <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" class="size-4" />
              </button>
            </div>
          </div>

          <!-- Remember Me Checkbox & Quick Demo Fill -->
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                type="checkbox"
                [(ngModel)]="rememberMe"
                name="rememberMe"
                class="size-4 rounded accent-purple-600 cursor-pointer"
              />
              <span class="text-xs font-medium text-gray-600 dark:text-gray-400">Remember this device</span>
            </label>

            <button
              type="button"
              (click)="fillDemoCredentials()"
              class="text-[11px] font-bold text-purple-700 dark:text-purple-300 bg-purple-50 dark:bg-purple-950/60 hover:bg-purple-100 dark:hover:bg-purple-900/60 border border-purple-200 dark:border-purple-800 px-2.5 py-1 rounded-lg transition-colors cursor-pointer"
            >
              Fill Demo Login
            </button>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            [disabled]="isLoading()"
            class="w-full flex items-center justify-center gap-2 rounded-xl bg-purple-600 py-3 text-sm font-bold text-white shadow-md shadow-purple-600/30 hover:bg-purple-700 active:scale-98 transition-all cursor-pointer disabled:opacity-70"
          >
            @if (isLoading()) {
              <span class="size-4 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
              <span>Signing in...</span>
            } @else {
              <span>Sign In</span>
              <ng-icon name="lucideArrowRight" class="size-4" />
            }
          </button>
        </form>

        <!-- Divider -->
        <div class="relative flex items-center justify-center my-4">
          <div class="border-t border-gray-200 dark:border-gray-800 w-full"></div>
          <span class="bg-white dark:bg-gray-900 px-3 text-xs font-semibold text-gray-400 uppercase">Or continue with</span>
        </div>

        <!-- Social Logins -->
        <div class="grid grid-cols-2 gap-3">
          <button
            type="button"
            (click)="socialLogin('Google')"
            class="flex items-center justify-center gap-2 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 py-2.5 text-xs font-bold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors shadow-2xs cursor-pointer"
          >
            <span>Google</span>
          </button>
          <button
            type="button"
            (click)="socialLogin('Apple')"
            class="flex items-center justify-center gap-2 rounded-xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-950 py-2.5 text-xs font-bold text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors shadow-2xs cursor-pointer"
          >
            <span>Apple</span>
          </button>
        </div>

        <!-- Link to Register -->
        <div class="pt-2 text-center text-xs text-gray-500 dark:text-gray-400">
          Don't have a ShopEase account yet?
          <a [routerLink]="['/register']" class="font-bold text-purple-600 dark:text-purple-400 hover:underline ml-1">
            Register now
          </a>
        </div>
      </div>
    </div>
  </main>

  <footer class="w-full text-center py-4 text-xs text-gray-400 dark:text-gray-600">
    © 2026 ShopEase Inc. Safe & encrypted authentication.
  </footer>
</div>
