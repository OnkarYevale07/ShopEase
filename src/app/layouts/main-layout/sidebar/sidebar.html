<div hlmSidebarWrapper>
  <hlm-sidebar collapsible="icon">
    <!-- Company & Branch Header -->
    <div hlmSidebarHeader class="border-b border-sidebar-border/50 p-2">
      <div class="flex items-center justify-between gap-2">
        <!-- Logo and Branch Info (Clicking when collapsed expands the sidebar) -->
        <button
          type="button"
          (click)="onLogoClick()"
          class="flex flex-1 items-center gap-2 overflow-hidden rounded-md p-1 text-left transition-colors hover:bg-sidebar-accent/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sidebar-ring group-data-[collapsible=icon]:justify-center group-data-[collapsible=icon]:p-0"
        >
          <!-- Branch / Company Logo Mark (Always visible in expanded & collapsed state) -->
          <div
            class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-sidebar-primary text-sidebar-primary-foreground font-bold shadow-xs"
          >
            <!-- You can use an <img> or an <ng-icon> here -->
            <ng-icon [name]="company.logoIcon" class="size-4" />
          </div>

          <!-- Branch & Company Details (Hidden when collapsed) -->
          <div
            class="grid flex-1 text-left text-xs leading-tight group-data-[collapsible=icon]:hidden"
          >
            <span class="truncate font-semibold text-sidebar-foreground text-sm">{{
              company.name
            }}</span>
            <span class="truncate text-sidebar-foreground/70">{{ company.branch }}</span>
          </div>
        </button>

        <!-- Header Collapse Trigger (Visible ONLY when expanded, so it never replaces the logo when collapsed) -->
        <button
          hlmSidebarTrigger
          class="text-sidebar-foreground hover:bg-sidebar-accent hover:text-sidebar-accent-foreground group-data-[collapsible=icon]:hidden"
        ></button>
      </div>
    </div>

    <div hlmSidebarContent>
      <div hlmSidebarGroup>
        <!-- Searchbox: Hidden when sidebar is collapsed into icon mode -->
        <div class="group-data-[collapsible=icon]:hidden mb-2">
          <div hlmField orientation="horizontal" class="bg-white rounded-lg border-gray-200">
            <input
              hlmInput
              type="search"
              placeholder="Search..."
              class="bg-white text-gray-900 placeholder:text-gray-400 focus-visible:ring-2 focus-visible:ring-purple-500"
            />
          </div>
        </div>
        <!-- <div hlmSidebarGroupLabel>Menu</div> -->
        <div hlmSidebarGroupContent>
          <ul hlmSidebarMenu>
            @for (item of _items; track item.title) {
              <li hlmSidebarMenuItem>
                <a
                  hlmSidebarMenuButton
                  [routerLink]="item.url"
                  routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground font-semibold"
                  [routerLinkActiveOptions]="{ exact: item.url === '/dashboard' }"
                  [tooltip]="item.title"
                  class="py-6"
                >
                  <ng-icon [name]="item.icon" />
                  <span>{{ item.title }}</span>
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    </div>

    <div hlmSidebarFooter class="border-t border-sidebar-border/50">
      <ul hlmSidebarMenu>
        @for (item of footerItems; track item.title) {
          <li hlmSidebarMenuItem>
            <a
              hlmSidebarMenuButton
              [routerLink]="item.url"
              routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground font-semibold"
              [routerLinkActiveOptions]="{ exact: item.url === '/dashboard' }"
              [tooltip]="item.title"
            >
              <ng-icon [name]="item.icon" />
              <span>{{ item.title }}</span>
            </a>
          </li>
        }
        <!-- Convenient collapse toggle in footer: keeps the top exclusively for the logo -->
        <li hlmSidebarMenuItem>
          <button hlmSidebarMenuButton (click)="toggleSidebar()" tooltip="Toggle Sidebar">
            <ng-icon name="lucidePanelLeft" />
            <span>Collapse</span>
          </button>
        </li>
      </ul>
    </div>
  </hlm-sidebar>
  <ng-content />
</div>
